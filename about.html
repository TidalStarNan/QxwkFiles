<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队成员 - 青翔未阔工作室</title>
    <link rel="icon" type="image/webp" href="/favicon.webp">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #6bb3d9 0%, #6fc0b0 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: white;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 {
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin: 0;
        }
        .back-link a {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s;
            cursor: pointer;
            white-space: nowrap;
        }
        .back-link a:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.02);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        @media (max-width: 640px) {
            .header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
        }
        .team-section {
            margin-bottom: 40px;
        }
        .team-section h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }
        .member-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .member-card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid rgba(255,255,255,0.3);
            transition: transform 0.2s, background 0.2s;
        }
        .member-card:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-4px);
        }
        .member-card.full-width {
            grid-column: 1 / -1;
        }
        .member-card .full-text {
            flex: 1;
            font-size: 1rem;
            line-height: 1.6;
        }
        .member-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .member-info {
            flex: 1;
            min-width: 0;
        }
        .member-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 4px;
            word-break: break-word;
        }
        .member-desc {
            font-size: 0.9rem;
            opacity: 0.9;
            line-height: 1.4;
            word-break: break-word;
        }
        @media (max-width: 600px) {
            .member-card {
                flex-direction: row;
                align-items: center;
            }
            .member-avatar {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
            .member-name {
                font-size: 1.1rem;
            }
            .member-desc {
                font-size: 0.85rem;
            }
        }

        /* ---- 新增：针对“关于工作室”卡片垂直布局，让按钮显示在文字下方 ---- */
        .team-section:first-of-type .member-card.full-width {
            flex-direction: column;
            align-items: stretch;
            text-align: left;   /* 文本保持左对齐，美观 */
        }

        /* ---- 联系我们 按钮样式（玻璃质感，与整体风格完美融合）---- */
        .contact-button {
            display: table;          /* 配合 margin: auto 实现居中 */
            margin: 20px auto 8px auto;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            letter-spacing: 1px;
            text-align: center;
        }
        .contact-button:hover {
            background: rgba(255, 255, 255, 0.45);
            transform: scale(1.02);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
            border-color: rgba(255, 255, 255, 0.8);
        }
        .contact-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧑‍💻 团队成员</h1>
            <div class="back-link">
                <a href="index.html">🏠 返回首页</a>
            </div>
        </div>

        <!-- 关于工作室 -->
        <div class="team-section">
            <h2>📖 关于工作室</h2>
            <div class="member-grid">
                <div class="member-card full-width">
                    <div class="full-text">这个工作室很懒，什么也没有写。</div>
                    <!-- 联系我们的按钮：点击直接发送邮件到 QxwkStudio@outlook.com (自动添加友好主题)  -->
                    <a href="mailto:QxwkStudio@outlook.com?subject=咨询青翔未阔工作室" class="contact-button">📧 联系我们</a>
                </div>
            </div>
        </div>

        <!-- 摸鱼成员 -->
        <div class="team-section">
            <h2>🎣 摸鱼成员</h2>
            <div class="member-grid" id="coreMembers"></div>
        </div>

        <!-- 特别贡献 -->
        <div class="team-section">
            <h2>🌟 特别贡献</h2>
            <div class="member-grid" id="contribMembers"></div>
        </div>

        <!-- 域名赞助（新增栏目，与上面并列） -->
        <div class="team-section">
            <h2>💰 域名赞助</h2>
            <div class="member-grid" id="sponsorMembers"></div>
        </div>
    </div>

    <script>
        // ---------- 数据定义（完全并列，清晰易维护）----------
        const coreMembers = [
            { name: '青翔未阔', desc: '工作室创始人', avatar: 'https://weavatar.com/avatar/8493cacb76284a997ac75cf43bbd8a2ab3f1ee9127250f5ead7086a741e51f00?s=400' },
            { name: '米可-Micro', desc: '工作室联合创始人', avatar: 'https://weavatar.com/avatar/97519024b6678a197130591df9a76e6a6d80bd0d7aecd2b074dafee1dbc2512b?s=400' },
            { name: '心态不爱打牌', desc: '工作室联合创始人', avatar: 'https://weavatar.com/avatar/473bdd519211e37b2b31bd3231b81aa50ad8f5fdbc956d6087cc956f320f98be?s=400' },
            { name: '幻想繁星', desc: '工作室联合创始人', avatar: 'https://weavatar.com/avatar/0a258e851779fecdff48b0594af16eaaf280bbc06281bc4e35cd7e3e8a44068b?s=400' },
            { name: '阿江_233', desc: '首席指令师 & 建筑师', avatar: 'https://weavatar.com/avatar/e660bc25449e3cd818d29339cc66c6dd2c454bee03dd8c1f861d62e578f533ff?s=400' },
            { name: 'AmargoLeaf', desc: '建筑师&技术支持', avatar: '' }
        ];

        const contribMembers = [
            { name: '青翔熙亦', desc: '不知道写什么比较好', avatar: 'https://weavatar.com/avatar/ec8877cd68a143a1e0758d3ebaee9a5e46f0a941f1b694ada2dbc59a025fa0c3?s=400' },
            { name: '笨蛋小鞠子', desc: '建筑师 & 重工业爱好者', avatar: 'https://weavatar.com/avatar/6cdcb6920a64c3558c0e16158a15e855946c4e09504077771164b9fa1f49fa23?s=400' },
            { name: '念帆AsheL', desc: '建筑师 & 成分复杂', avatar: 'https://weavatar.com/avatar/368f1711a5824be33c1120ab619b35d990f05387c263ad862dc91be8806c06b5?s=400' },
            { name: '358k3', desc: '建筑师 & 萌新主播', avatar: 'https://weavatar.com/avatar/9facc2555a3d37ed0301bf920173a19427cd5fb459d4a0686e89f3e90c78f5a9?s=400' },
            { name: '风抚落意尘', desc: '喵？', avatar: 'https://weavatar.com/avatar/52f7cdc7cf35de19c3a08e7255409a7d878db720c93be0b40badd8321cd85250?s=400' }
        ];

        // 域名赞助列表（金额以元为单位，显示在描述中）
        const sponsorMembers = [
            { name: '阿江_233', desc: '赞助 ¥40', avatar: 'https://weavatar.com/avatar/e660bc25449e3cd818d29339cc66c6dd2c454bee03dd8c1f861d62e578f533ff?s=400' },
            { name: '风抚落意尘', desc: '赞助 ¥40', avatar: 'https://weavatar.com/avatar/52f7cdc7cf35de19c3a08e7255409a7d878db720c93be0b40badd8321cd85250?s=400' },
            { name: '米可-Micro', desc: '赞助 ¥40', avatar: 'https://weavatar.com/avatar/97519024b6678a197130591df9a76e6a6d80bd0d7aecd2b074dafee1dbc2512b?s=400' },
            { name: '笨蛋小鞠子', desc: '赞助 ¥40', avatar: 'https://weavatar.com/avatar/6cdcb6920a64c3558c0e16158a15e855946c4e09504077771164b9fa1f49fa23?s=400' },
            { name: '心态不爱打牌', desc: '赞助 ¥35', avatar: 'https://weavatar.com/avatar/473bdd519211e37b2b31bd3231b81aa50ad8f5fdbc956d6087cc956f320f98be?s=400' },
            { name: 'ZCNotFound', desc: '赞助 ¥18.88', avatar: 'https://weavatar.com/avatar/ea58b547036f75a4d21a21730bee85e21d0736aad56819d9e59d12a873fc6f21?s=400' },
            { name: '青翔未阔', desc: '赞助 ¥16.12', avatar: 'https://weavatar.com/avatar/8493cacb76284a997ac75cf43bbd8a2ab3f1ee9127250f5ead7086a741e51f00?s=400' }
        ];

        // ---------- 通用渲染函数 ----------
        function renderMembers(containerId, members) {
            const container = document.getElementById(containerId);
            if (!container) return;
            let html = '';
            members.forEach(member => {
                let avatarStyle = '';
                let avatarContent = '';
                if (member.avatar && member.avatar.trim() !== '') {
                    avatarStyle = `background-image: url('${member.avatar}');`;
                } else {
                    avatarContent = member.name.charAt(0).toUpperCase();
                }
                html += `
                    <div class="member-card">
                        <div class="member-avatar" style="${avatarStyle}">${avatarContent}</div>
                        <div class="member-info">
                            <div class="member-name">${escapeHtml(member.name)}</div>
                            <div class="member-desc">${escapeHtml(member.desc)}</div>
                        </div>
                    </div>`;
            });
            container.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ---------- 渲染所有板块（并列调用，清晰简洁）----------
        renderMembers('coreMembers', coreMembers);
        renderMembers('contribMembers', contribMembers);
        renderMembers('sponsorMembers', sponsorMembers);
    </script>
</body>
</html>
